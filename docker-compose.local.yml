# Build this checkout instead of running upstream prebuilt images.
# docker compose -f docker-compose.prod.yml -f docker-compose.local.yml --profile agents up -d --build
x-local-backend: &local-backend
  image: securo-backend:local
  build: ./backend

services:
  backend:
    <<: *local-backend
  celery-worker:
    <<: *local-backend
  celery-beat:
    <<: *local-backend
  mcp-server:
    <<: *local-backend
  frontend:
    image: securo-frontend:local
    build: ./frontend
